name: Playwright Tests & Deploy
on:
  push:
    branches: [feat/dashboard-users]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-practices/dashboard-users

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests (generate HTML report)
        run: npx playwright test --reporter=html

      - name: Pull Vercel env (prod)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Playwright report to Vercel
        run: npx vercel deploy playwright-report --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
