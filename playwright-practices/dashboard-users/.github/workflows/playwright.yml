name: Playwright Tests & Deploy
on:
  push:
    branches: [feat/dashboard-users]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-practices/dashboard-users
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (HTML report)
        run: npx playwright test --reporter=html

      - name: Upload report artifact (optional)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-practices/dashboard-users/playwright-report/
          retention-days: 14

      - name: Deploy Playwright report to Vercel
        run: npx vercel deploy playwright-practices/dashboard-users/playwright-report --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
